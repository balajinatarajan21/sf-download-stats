<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spidey Download Statistics</title>
<link rel="stylesheet" href="style.css">
<script>
const startDate = "2026-05-01";
const endDate = new Date().toISOString().split("T")[0];

const api = `https://sourceforge.net/projects/spidey/files/stats/json?start_date=${startDate}&end_date=${endDate}&period=monthly`;

async function load() {
    try {
        const response = await fetch(api);
        const d = await response.json();

        // -------------------------
        // Monthly Downloads
        // -------------------------
        const labels = [];
        const values = [];

        d.downloads.forEach(([date, downloads]) => {
            labels.push(
                new Date(date).toLocaleString("en-US", {
                    month: "short",
                    year: "numeric"
                })
            );
            values.push(downloads);
        });

        // -------------------------
        // Summary Cards
        // -------------------------
        document.getElementById("total").textContent =
            d.total.toLocaleString();

        const max = Math.max(...values);
        const maxIndex = values.indexOf(max);

        document.getElementById("topMonth").textContent =
            `${labels[maxIndex]} (${max.toLocaleString()})`;

        document.getElementById("avg").textContent =
            Math.round(d.total / values.length).toLocaleString();

        // -------------------------
        // Partial Month Notice
        // -------------------------
        if (d.last_period_incomplete) {
            const badge = document.createElement("div");
            badge.style.textAlign = "center";
            badge.style.marginBottom = "15px";
            badge.style.color = "#ffd54f";
            badge.style.fontWeight = "600";
            badge.textContent =
                `⚠ ${labels[labels.length - 1]} is a partial month`;
            document.querySelector(".chart-card").prepend(badge);
        }

        // -------------------------
        // Chart
        // -------------------------
        new Chart(
            document.getElementById("downloadsChart"),
            {
                type: "bar",
                data: {
                    labels,
                    datasets: [{
                        label: "Downloads",
                        data: values,
                        backgroundColor: "rgba(74,144,226,0.85)",
                        borderColor: "#6bb7ff",
                        borderWidth: 2,
                        borderRadius: 12,
                        hoverBackgroundColor: "#79c0ff"
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: ctx =>
                                    ctx.raw.toLocaleString() + " downloads"
                            }
                        }
                    },

                    scales: {
                        x: {
                            ticks: {
                                color: "#ffffff"
                            },
                            grid: {
                                color: "rgba(255,255,255,0.08)"
                            }
                        },

                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: "#ffffff"
                            },
                            grid: {
                                color: "rgba(255,255,255,0.08)"
                            }
                        }
                    }
                }
            }
        );

    } catch (err) {
        console.error(err);

        document.querySelector(".chart-card").innerHTML = `
            <div class="error">
                Unable to load SourceForge statistics.<br><br>
                This is usually caused by the API blocking CORS requests.
            </div>`;
    }
}

load();
</script>
</body>
</html>
